<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Privacy Policy – Neta OS Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #FAFAFA;
    --card: #FFFFFF;
    --border: #EEEEEE;
    --text: #000000;
    --text-2: #6B6B6B;
    --pill: #F2F2F2;
    --pill-text: #5A5A5A;
    --badge-bg: #000000;
    --badge-text: #FFFFFF;
    --hero-bg: #000000;
    --hero-text: #FFFFFF;
    --hero-sub: #A8A8A8;
    --hero-field: #222222;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0E0E0E; --card: #171717; --border: #262626;
      --text: #FFFFFF; --text-2: #A3A3A3;
      --pill: #1F1F1F; --pill-text: #B5B5B5;
      --badge-bg: #FFFFFF; --badge-text: #000000;
      --hero-bg: #1C1C1C; --hero-text: #FFFFFF; --hero-sub: #A8A8A8; --hero-field: #2A2A2A;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0E0E0E; --card: #171717; --border: #262626;
    --text: #FFFFFF; --text-2: #A3A3A3;
    --pill: #1F1F1F; --pill-text: #B5B5B5;
    --badge-bg: #FFFFFF; --badge-text: #000000;
    --hero-bg: #1C1C1C; --hero-text: #FFFFFF; --hero-sub: #A8A8A8; --hero-field: #2A2A2A;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    max-width: 760px; margin: 0 auto; padding: 20px 20px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-weight: 800; font-size: 18px; letter-spacing: -0.01em; }
  .brand span { color: var(--text-2); font-weight: 500; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--pill); color: var(--pill-text);
    border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 600;
  }
  .chip svg { width: 14px; height: 14px; }
  h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 800; letter-spacing: -0.02em; margin: 16px 0 8px; line-height: 1.1; }
  .lead { color: var(--text-2); font-size: 16px; margin: 0 0 32px; max-width: 60ch; }
  .sections { display: grid; gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
  }
  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .badge {
    flex: none; width: 28px; height: 28px; border-radius: 50%;
    background: var(--badge-bg); color: var(--badge-text);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .card h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .card p { margin: 0 0 10px; color: var(--text-2); font-size: 15px; }
  .card p:last-child { margin-bottom: 0; }
  .card ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .card li { position: relative; padding-left: 16px; color: var(--text-2); font-size: 15px; }
  .card li::before {
    content: ""; position: absolute; left: 0; top: 9px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--text);
  }
  .contact {
    margin-top: 16px; background: var(--hero-bg); color: var(--hero-text);
    border-radius: 16px; padding: 24px;
  }
  .contact h2 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .contact p { margin: 0 0 16px; color: var(--hero-sub); font-size: 14px; }
  .email {
    width: 100%; display: flex; align-items: center; gap: 10px;
    background: var(--hero-field); color: var(--hero-text);
    border: 0; border-radius: 12px; padding: 12px 14px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; text-align: left;
  }
  .email:hover { filter: brightness(1.15); }
  .email:focus-visible { outline: 2px solid var(--hero-text); outline-offset: 2px; }
  .email svg { width: 18px; height: 18px; flex: none; }
  .email .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .email .hint { font-size: 12px; font-weight: 500; color: var(--hero-sub); }
  footer { margin-top: 28px; text-align: center; font-size: 12px; color: var(--text-2); }
  @media (max-width: 480px) { .card { padding: 16px; } main { padding-top: 24px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Neta OS <span>· Admin</span></div>
</header>

<main>
  <span class="chip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/></svg>
    Last updated: 27 Oct 2026
  </span>
  <h1>Privacy Policy</h1>
  <p class="lead">How Neta OS collects, uses and protects information when you use the survey admin dashboard.</p>

  <div class="sections" id="sections"></div>

  <section class="contact" aria-labelledby="contact-title">
    <h2 id="contact-title">Questions about this policy?</h2>
    <p>Reach out to our privacy team and we will respond as soon as possible.</p>
    <button class="email" id="emailBtn" type="button" aria-label="Copy privacy contact email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <span class="grow">privacy@netaos.in</span>
      <span class="hint" id="hint">Copy</span>
    </button>
  </section>

  <footer>© 2026 Neta OS. All rights reserved.</footer>
</main>

<script>
  var SECTIONS = [
    { t: "Information we collect",
      d: "When you use the admin dashboard, we may collect the following information:",
      b: ["Account details such as your name, phone number, email and role.",
          "Login and authentication data, including OTP verification events.",
          "Device and usage information such as IP address, browser and activity logs.",
          "Survey data you create, view, edit or export through the dashboard."] },
    { t: "How we use your information",
      b: ["To authenticate you and provide access to the dashboard.",
          "To manage surveys, responses, field teams and reports.",
          "To monitor performance, prevent misuse and improve the product.",
          "To communicate important updates, alerts and support responses."] },
    { t: "Survey respondent data",
      d: "Data collected from survey respondents is treated as confidential. Admins must only access it for authorised purposes and must not share, copy or disclose it outside the organisation without permission." },
    { t: "Data sharing",
      d: "We do not sell your personal information. Data may be shared only:",
      b: ["With trusted service providers who help us operate the platform.",
          "When required by law, regulation or valid legal process.",
          "To protect the rights, safety and security of users and the platform."] },
    { t: "Data security",
      d: "We use industry-standard safeguards including encrypted transmission, access controls and audit logs. No system is completely secure, so please keep your credentials confidential and report suspicious activity immediately." },
    { t: "Data retention",
      d: "We retain information only as long as needed for the purposes described in this policy, or as required by law. Data may be anonymised or deleted once it is no longer required." },
    { t: "Your rights",
      b: ["Access and request a copy of your personal information.",
          "Correct inaccurate or incomplete information.",
          "Request deletion of your account, subject to legal obligations.",
          "Withdraw consent where processing is based on consent."] },
    { t: "Changes to this policy",
      d: "We may update this policy from time to time. Significant changes will be notified through the dashboard. Continued use after changes means you accept the updated policy." }
  ];

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  var root = document.getElementById("sections");
  SECTIONS.forEach(function (s, i) {
    var card = el("article", "card");
    var head = el("div", "card-head");
    head.appendChild(el("span", "badge", String(i + 1)));
    head.appendChild(el("h2", "", s.t));
    card.appendChild(head);
    if (s.d) card.appendChild(el("p", "", s.d));
    if (s.b) {
      var ul = el("ul");
      s.b.forEach(function (x) { ul.appendChild(el("li", "", x)); });
      card.appendChild(ul);
    }
    root.appendChild(card);
  });

  document.getElementById("emailBtn").addEventListener("click", function () {
    var hint = document.getElementById("hint");
    function done(msg) {
      hint.textContent = msg;
      setTimeout(function () { hint.textContent = "Copy"; }, 1800);
    }
    try {
      navigator.clipboard.writeText("privacy@netaos.in").then(
        function () { done("Copied"); },
        function () { done("Press Ctrl+C"); }
      );
    } catch (e) { done("Press Ctrl+C"); }
  });
</script>
</body>
</html>
